<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>LockingVault</title>
<style>
:root{
  --deep:#0B1519; --mid:#122229; --panel:#172C34; --edge:#28454F;
  --pale:#D9E2E0; --dim:#7C9299; --brass:#C4913F; --cyan:#63B6C9; --warn:#D97064;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--deep);color:var(--pale);font-family:var(--sans);
  font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---------- sealed state ---------- */
#seal{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 22px;gap:26px}
.mark{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mark h1{font-size:30px;font-weight:650;letter-spacing:-.02em;margin:0}
.mark span{font-family:var(--mono);font-size:12px;color:var(--brass)}
.lede{color:var(--dim);font-size:14.5px;margin:-16px 0 0;max-width:38ch}

.keyhole{align-self:center;margin:4px 0}
.keyhole circle,.keyhole path{transition:stroke .5s ease,fill .5s ease}
.open .keyhole circle{stroke:var(--cyan)}
.open .keyhole path{fill:var(--cyan)}

.field{display:flex;flex-direction:column;gap:7px}
label{font-size:13px;color:var(--dim)}
input[type=password],input[type=text],textarea{
  width:100%;background:var(--mid);border:1px solid var(--edge);border-radius:9px;
  padding:13px 14px;font-family:var(--mono);font-size:15px;
}
textarea{resize:vertical;min-height:74px;line-height:1.7}
.btn{
  background:var(--brass);color:#0B1519;font-weight:640;border-radius:9px;
  padding:14px;width:100%;text-align:center;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;border:1px solid var(--edge);color:var(--pale);font-weight:500}
.btn.slim{padding:10px;font-size:14px}
.row{display:flex;gap:9px}
.row>*{flex:1}
.msg{font-size:13.5px;min-height:19px;color:var(--warn)}
.filename{font-family:var(--mono);font-size:12.5px;color:var(--dim);word-break:break-all}

.note{
  border-left:2px solid var(--brass);padding:10px 0 10px 12px;
  font-size:12.5px;color:var(--dim);line-height:1.55;
}

/* ---------- passphrase reveal ---------- */
.phrase{
  background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:16px;
  font-family:var(--mono);font-size:17px;line-height:1.9;word-spacing:.35em;
}
.phrase b{font-weight:400;color:var(--cyan)}

/* ---------- vault state ---------- */
#vault{flex:1;display:none;flex-direction:column}
.bar{
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  border-bottom:1px solid var(--edge);position:sticky;top:0;background:var(--deep);z-index:2;
}
.bar .count{flex:1;font-size:14px;color:var(--dim)}
.bar .count b{color:var(--pale);font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--edge);
  display:grid;place-items:center;font-size:19px;line-height:1}

.list{flex:1;padding:6px 18px 18px}
.entry{border-bottom:1px solid var(--panel);padding:14px 0}
.entry h3{margin:0;font-size:16px;font-weight:600}
.entry .user{font-family:var(--mono);font-size:13px;color:var(--dim);margin-top:2px}
.entry .secret{
  font-family:var(--mono);font-size:14px;margin-top:9px;padding:9px 11px;
  background:var(--mid);border-radius:7px;color:var(--cyan);
  overflow-wrap:anywhere;display:none;
}
.entry.shown .secret{display:block}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{font-size:13px;color:var(--dim);border:1px solid var(--panel);
  border-radius:7px;padding:6px 11px}
.acts button:hover{color:var(--pale)}
.acts .del{margin-left:auto;color:var(--warn);border-color:transparent}

.empty{padding:52px 4px;color:var(--dim);font-size:14.5px}

.foot{padding:14px 18px;border-top:1px solid var(--edge);display:flex;gap:9px;
  position:sticky;bottom:0;background:var(--deep)}
.foot>*{flex:1}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;background:rgba(4,10,12,.72);display:none;
  align-items:flex-end;justify-content:center;z-index:10}
.sheet.on{display:flex}
.sheet .inner{background:var(--mid);border:1px solid var(--edge);
  border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:520px;
  display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.sheet h2{margin:0;font-size:18px;font-weight:620}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--edge);border-radius:9px;
  padding:10px 16px;font-size:14px;z-index:20;opacity:0;pointer-events:none;
  transition:opacity .2s}
.toast.on{opacity:1}

.fade{transition:opacity .45s ease,transform .45s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ SEALED ============ -->
  <section id="seal">
    <div class="mark"><h1>LockingVault</h1><span id="verline">VLT1</span></div>
    <p class="lede">A single encrypted file. Your passphrase never leaves this page, and neither does anything you put inside.</p>

    <svg class="keyhole" width="54" height="54" viewBox="0 0 54 54" aria-hidden="true">
      <circle cx="27" cy="27" r="24" fill="none" stroke="#C4913F" stroke-width="1.5"/>
      <path fill="#C4913F" d="M27 15a7 7 0 0 0-3.2 13.2L21.5 39h11l-2.3-10.8A7 7 0 0 0 27 15Z"/>
    </svg>

    <div id="stage-choose">
      <div class="row">
        <button class="btn" id="b-open">Open a vault file</button>
      </div>
      <div class="row" style="margin-top:9px">
        <button class="btn ghost" id="b-new">Create a new vault</button>
      </div>
    </div>

    <div id="stage-unlock" hidden>
      <div class="field">
        <label for="pp">Passphrase</label>
        <textarea id="pp" autocomplete="off" autocapitalize="none" autocorrect="off"
          spellcheck="false" placeholder="six words, separated by spaces"></textarea>
      </div>
      <p class="msg" id="m-unlock"></p>
      <button class="btn" id="b-unlock">Unlock</button>
      <div class="row" style="margin-top:9px">
        <button class="btn ghost slim" id="b-back">Back</button>
      </div>
      <p class="filename" id="fname" style="margin-top:14px"></p>
    </div>

    <div id="stage-new" hidden>
      <p style="margin:0;font-size:14.5px">This is the only thing that opens your vault. Write it down before you continue — there is no recovery.</p>
      <div class="phrase" id="gen" style="margin:14px 0"></div>
      <div class="row">
        <button class="btn ghost slim" id="b-regen">Generate another</button>
        <button class="btn ghost slim" id="b-copyphrase">Copy</button>
      </div>
      <div class="field" style="margin-top:16px">
        <label for="confirm">Type it back to confirm</label>
        <textarea id="confirm" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></textarea>
      </div>
      <p class="msg" id="m-new"></p>
      <button class="btn" id="b-create">Create vault</button>
      <div class="row" style="margin-top:9px">
        <button class="btn ghost slim" id="b-back2">Back</button>
      </div>
    </div>

    <p class="note" id="kdfnote"></p>
  </section>

  <!-- ============ UNLOCKED ============ -->
  <section id="vault">
    <div class="bar">
      <div class="count"><b id="n">0</b> <span id="nlabel">entries</span></div>
      <button class="iconbtn" id="b-add" title="Add entry" aria-label="Add entry">+</button>
      <button class="iconbtn" id="b-lock" title="Lock" aria-label="Lock vault">◍</button>
    </div>
    <div class="list" id="list"></div>
    <div class="foot">
      <button class="btn" id="b-save">Save vault</button>
    </div>
  </section>
</div>

<!-- ============ ADD SHEET ============ -->
<div class="sheet" id="sheet">
  <div class="inner">
    <h2>New entry</h2>
    <div class="field"><label for="e-title">Name</label><input id="e-title" type="text" placeholder="GitHub"></div>
    <div class="field"><label for="e-user">Username</label><input id="e-user" type="text" autocapitalize="none"></div>
    <div class="field"><label for="e-secret">Password</label><input id="e-secret" type="text" autocapitalize="none" spellcheck="false"></div>
    <button class="btn ghost slim" id="b-genpw">Generate a strong password</button>
    <div class="field"><label for="e-url">Website</label><input id="e-url" type="text" autocapitalize="none" placeholder="https://"></div>
    <div class="row">
      <button class="btn ghost" id="b-cancel">Cancel</button>
      <button class="btn" id="b-save-entry">Add entry</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<!-- Load order matters: each file attaches to window.LV and the next
     one uses it. Classic scripts, not modules, so this page still
     works when opened directly from disk over file://. -->

<script>
/* argon2.js — adapter over the vendored Argon2 WASM build.
 *
 * The vendor library (hash-wasm) exposes window.hashwasm.argon2id with
 * its own parameter names. Everything else in this app expects the
 * argon2-browser shape — window.argon2.hash({ pass, salt, time, mem,
 * parallelism, hashLen, type }) resolving to { hash: Uint8Array }.
 *
 * Normalising here rather than in crypto.js means swapping the vendor
 * library later is a change to this file alone, and crypto.js never
 * learns which build is underneath it.
 *
 * Must load after the vendor script and before js/crypto.js, which
 * decides at load time whether Argon2 is available.
 */
window.LV = window.LV || {};

(function () {
  const lib = window.hashwasm;
  if (!lib || typeof lib.argon2id !== 'function') return; // crypto.js falls back to PBKDF2

  const ArgonType = { Argon2d: 0, Argon2i: 1, Argon2id: 2 };

  async function hash(opts) {
    const type = opts.type === undefined ? ArgonType.Argon2id : opts.type;
    if (type !== ArgonType.Argon2id) throw new Error('Only Argon2id is supported');

    // hash-wasm wants memorySize in KiB, same unit the VLT1 header
    // stores, so this passes straight through.
    const out = await lib.argon2id({
      password: opts.pass,
      salt: opts.salt,
      iterations: opts.time,
      memorySize: opts.mem,
      parallelism: opts.parallelism,
      hashLength: opts.hashLen,
      outputType: 'binary'
    });

    if (!(out instanceof Uint8Array) || out.length !== opts.hashLen) {
      throw new Error('Argon2 returned an unexpected result');
    }
    return { hash: out };
  }

  window.argon2 = { hash, ArgonType };
  LV.argon2Backend = 'hash-wasm';
})();

/* format.js — VLT1 container layout.
 *
 *  offset  size  field
 *  0       4     magic "VLT1"
 *  4       1     format version
 *  5       1     KDF id (1 = Argon2id, 2 = PBKDF2-SHA256)
 *  6       4     memory cost, KiB   (uint32 BE, 0 for PBKDF2)
 *  10      4     iterations         (uint32 BE)
 *  14      1     parallelism
 *  15      1     cipher id (1 = AES-256-GCM)
 *  16      16    salt
 *  32      12    nonce
 *  44      16    reserved (zero)
 *  60      1     header length
 *  61      ..    ciphertext + 16-byte GCM tag
 *
 * The whole header is passed as AEAD additional data, so KDF
 * parameters cannot be altered without failing authentication.
 */
window.LV = window.LV || {};

LV.format = (function () {
  const MAGIC = new Uint8Array([0x56, 0x4c, 0x54, 0x31]); // "VLT1"
  const HEADER_LEN = 61;
  const PAD_BLOCK = 4096;
  const VERSION = 0x01;
  const KDF_ARGON2ID = 0x01;
  const KDF_PBKDF2 = 0x02;
  const CIPHER_AES_GCM = 0x01;

  function buildHeader(params, salt, nonce) {
    const h = new Uint8Array(HEADER_LEN);
    const dv = new DataView(h.buffer);
    h.set(MAGIC, 0);
    h[4] = VERSION;
    h[5] = params.kdf;
    dv.setUint32(6, params.memoryKiB);
    dv.setUint32(10, params.iterations);
    h[14] = params.parallelism;
    h[15] = CIPHER_AES_GCM;
    h.set(salt, 16);
    h.set(nonce, 32);
    h[60] = HEADER_LEN;
    return h;
  }

  function parseHeader(bytes) {
    if (bytes.length < HEADER_LEN + 16) throw new Error('This file is too short to be a vault');
    const h = bytes.subarray(0, HEADER_LEN);
    if (!MAGIC.every((b, i) => h[i] === b)) throw new Error('This is not a vault file');
    if (h[4] !== VERSION) throw new Error('This vault was written by a newer version');
    if (h[5] !== KDF_ARGON2ID && h[5] !== KDF_PBKDF2) throw new Error('Unsupported key derivation');
    if (h[15] !== CIPHER_AES_GCM) throw new Error('Unsupported cipher');
    const dv = new DataView(h.buffer, h.byteOffset, HEADER_LEN);
    return {
      header: h,
      params: {
        kdf: h[5],
        memoryKiB: dv.getUint32(6),
        iterations: dv.getUint32(10),
        parallelism: h[14]
      },
      salt: h.subarray(16, 32),
      nonce: h.subarray(32, 44)
    };
  }

  // Pad to a 4KB boundary measured in UTF-8 bytes, so file size
  // does not reveal how many entries the vault holds.
  function padBytes(str) {
    const enc = new TextEncoder().encode(str);
    const target = Math.ceil((enc.length + 1) / PAD_BLOCK) * PAD_BLOCK;
    const out = new Uint8Array(target).fill(0x20); // space
    out.set(enc, 0);
    return out;
  }

  return {
    MAGIC, HEADER_LEN, PAD_BLOCK, VERSION,
    KDF_ARGON2ID, KDF_PBKDF2, CIPHER_AES_GCM,
    buildHeader, parseHeader, padBytes
  };
})();

    let raw;

    if (params.kdf === F.KDF_ARGON2ID) {
      if (!HAS_ARGON2) throw new Error('This vault needs Argon2, which this build does not include');
      const r = await window.argon2.hash({
        pass,
        salt,
        time: params.iterations,
        mem: params.memoryKiB,
        parallelism: params.parallelism,
        hashLen: 32,
        type: window.argon2.ArgonType.Argon2id
      });
      raw = r.hash;
    } else {
      const base = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
      raw = new Uint8Array(await crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt, iterations: params.iterations, hash: 'SHA-256' }, base, 256));
    }

    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
  }

  async function encryptVault(data, phrase, params) {
    params = params || DEFAULT_PARAMS;
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const nonce = crypto.getRandomValues(new Uint8Array(12)); // never reused
    const header = F.buildHeader(params, salt, nonce);
    const key = await deriveKey(phrase, salt, params);

    const pt = F.padBytes(JSON.stringify(data));
    const ct = new Uint8Array(await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv: nonce, additionalData: header, tagLength: 128 }, key, pt));

    const out = new Uint8Array(F.HEADER_LEN + ct.length);
    out.set(header, 0);
    out.set(ct, F.HEADER_LEN);
    return out;
  }

  async function decryptVault(bytes, phrase) {
    const { header, params, salt, nonce } = F.parseHeader(bytes);
    const key = await deriveKey(phrase, salt, params);

    let pt;
    try {
      pt = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: nonce, additionalData: header, tagLength: 128 },
        key, bytes.subarray(F.HEADER_LEN));
    } catch (e) {
      // Wrong passphrase and tampered file are deliberately
      // indistinguishable. GCM verifies the tag before releasing
      // any plaintext, so a failed unlock leaks nothing.
      throw new Error('Could not unlock. Check the passphrase.');
    }

    return { data: JSON.parse(new TextDecoder().decode(pt).trimEnd()), params };
  }

  return { HAS_ARGON2, DEFAULT_PARAMS, canonical, deriveKey, encryptVault, decryptVault };
})();
</script>
<script>
/* generate.js — passphrase and password generation.
 * All randomness comes from crypto.getRandomValues with rejection
 * sampling; a plain modulo would bias the low end of the wordlist
 * and quietly cost entropy on every vault created.
 */
window.LV = window.LV || {};

LV.generate = (function () {
  const PW_ALPHABET =
    'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*-_=+?';

  function secureIndex(max) {
    const limit = 65536 - (65536 % max); // 65536 % 7776 = 3328 discarded
    const buf = new Uint16Array(1);
    let v;
    do {
      crypto.getRandomValues(buf);
      v = buf[0];
    } while (v >= limit);
    return v % max;
  }

  // 6 words from the 7776-word EFF long list = 77.5 bits
  function passphrase(wordCount) {
    const n = wordCount || 6;
    const out = [];
    for (let i = 0; i < n; i++) out.push(LV.WORDS[secureIndex(LV.WORDS.length)]);
    return out;
  }

  function password(length) {
    const n = length || 20;
    let out = '';
    for (let i = 0; i < n; i++) out += PW_ALPHABET[secureIndex(PW_ALPHABET.length)];
    return out;
  }

  return { secureIndex, passphrase, password };
})();
</script>
<script>
/* storage.js — reading and writing the vault file.
 *
 * Where the File System Access API exists (Chromium desktop, and
 * Chrome on Android since v132) a file handle is kept so saves go
 * back to the same file. Firefox and Safari have declined to
 * implement it, so those fall back to picker-in / download-out.
 */
window.LV = window.LV || {};

LV.storage = (function () {
  const ACCEPT = { description: 'Vault file', accept: { 'application/octet-stream': ['.vault'] } };

  const canPick = 'showOpenFilePicker' in window && (function () {
    try { return window.self === window.top; } catch (e) { return false; }
  })();

  let handle = null;
  let name = 'my.vault';

  function fileName() { return name; }
  function inPlace() { return handle !== null; }

  function reset(newName) {
    handle = null;
    name = newName || 'my.vault';
  }

  async function open() {
    if (canPick) {
      const [h] = await window.showOpenFilePicker({ types: [ACCEPT] });
      handle = h;
      name = h.name;
      return new Uint8Array(await (await h.getFile()).arrayBuffer());
    }
    return new Promise(function (resolve, reject) {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.vault,application/octet-stream';
      inp.onchange = async function () {
        const f = inp.files[0];
        if (!f) return reject(new Error('No file chosen'));
        name = f.name;
        handle = null;
        resolve(new Uint8Array(await f.arrayBuffer()));
      };
      inp.click();
    });
  }

  async function save(bytes) {
    const blob = new Blob([bytes], { type: 'application/octet-stream' });

    if (handle) {
      const w = await handle.createWritable();
      await w.write(blob);
      await w.close();
      return 'Saved to ' + name;
    }

    if (canPick) {
      try {
        handle = await window.showSaveFilePicker({ suggestedName: name, types: [ACCEPT] });
        name = handle.name;
        const w = await handle.createWritable();
        await w.write(blob);
        await w.close();
        return 'Saved to ' + name;
      } catch (e) {
        if (e.name === 'AbortError') return 'Save cancelled';
      }
    }

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    return 'Downloaded ' + name;
  }

  return { canPick, open, save, reset, fileName, inPlace };
})();
</script>
<script>
/* vault.js — the decrypted model and its lifetime.
 * Plaintext and passphrase live here, in memory only, and are
 * dropped on lock. Nothing is written to localStorage or IndexedDB.
 */
window.LV = window.LV || {};

LV.vault = (function () {
  const IDLE_MS = 3 * 60 * 1000;

  let data = null;      // decrypted payload
  let phrase = null;    // master passphrase
  let pending = null;   // encrypted bytes awaiting unlock
  let idleTimer = null;
  let onIdleLock = null;

  const isOpen = function () { return data !== null; };
  const get = function () { return data; };
  const entries = function () { return data ? data.entries : []; };

  function touch() {
    data.updated = new Date().toISOString();
  }

  function resetIdle() {
    clearTimeout(idleTimer);
    if (!isOpen()) return;
    idleTimer = setTimeout(function () {
      lock();
      if (onIdleLock) onIdleLock();
    }, IDLE_MS);
  }

  function create(passphraseWords) {
    phrase = passphraseWords.join(' ');
    data = { v: 1, revision: 1, updated: new Date().toISOString(), entries: [] };
    resetIdle();
  }

  function adopt(decrypted, enteredPhrase) {
    data = decrypted;
    phrase = enteredPhrase;
    pending = null;
    resetIdle();
  }

  function lock() {
    data = null;
    phrase = null;
    pending = null;
    clearTimeout(idleTimer);
  }

  function addEntry(fields) {
    const now = new Date().toISOString();
    data.entries.push({
      id: crypto.randomUUID(),
      title: fields.title,
      username: fields.username || '',
      secret: fields.secret || '',
      url: fields.url || '',
      notes: '',
      tags: [],
      created: now,
      updated: now
    });
    touch();
  }

  function removeEntry(id) {
    data.entries = data.entries.filter(function (e) { return e.id !== id; });
    touch();
  }

  // Bumped on every save; this is what a sync layer would compare
  // to detect two devices writing over each other.
  function bumpRevision() {
    data.revision = (data.revision || 0) + 1;
    touch();
  }

  return {
    IDLE_MS, isOpen, get, entries,
    create, adopt, lock, addEntry, removeEntry, bumpRevision, resetIdle,
    setPending: function (b) { pending = b; },
    getPending: function () { return pending; },
    getPhrase: function () { return phrase; },
    onIdleLock: function (fn) { onIdleLock = fn; }
  };
})();
</script>
<script>
/* ui.js — DOM rendering only. No crypto, no file access.
 * Entry text is set through textContent throughout, so a stored
 * title or note can never become markup.
 */
window.LV = window.LV || {};

LV.ui = (function () {
  const $ = function (id) { return document.getElementById(id); };

  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('on');
    clearTimeout(t._t);
    t._t = setTimeout(function () { t.classList.remove('on'); }, 1900);
  }

  function showStage(which) {
    $('stage-choose').hidden = which !== 'choose';
    $('stage-unlock').hidden = which !== 'unlock';
    $('stage-new').hidden = which !== 'new';
  }

  function showSealed() {
    $('vault').style.display = 'none';
    $('seal').style.display = 'flex';
    document.body.classList.remove('open');
    $('pp').value = '';
    $('confirm').value = '';
    $('m-unlock').textContent = '';
    $('m-new').textContent = '';
    showStage('choose');
  }

  function showVault() {
    document.body.classList.add('open');
    $('seal').style.display = 'none';
    $('vault').style.display = 'flex';
  }

  function renderPhrase(words) {
    const box = $('gen');
    box.innerHTML = '';
    words.forEach(function (w, i) {
      const b = document.createElement('b');
      b.textContent = w;
      box.appendChild(b);
      if (i < words.length - 1) box.appendChild(document.createTextNode(' '));
    });
  }

  function renderEntries(entries, handlers) {
    const list = $('list');
    $('n').textContent = entries.length;
    $('nlabel').textContent = entries.length === 1 ? 'entry' : 'entries';
    list.innerHTML = '';

    if (!entries.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'Nothing stored yet. Tap + to add your first password.';
      list.appendChild(p);
      return;
    }

    entries.forEach(function (entry) {
      const el = document.createElement('div');
      el.className = 'entry';

      const h = document.createElement('h3');
      h.textContent = entry.title || 'Untitled';
      el.appendChild(h);

      if (entry.username) {
        const u = document.createElement('div');
        u.className = 'user';
        u.textContent = entry.username;
        el.appendChild(u);
      }

      const s = document.createElement('div');
      s.className = 'secret';
      s.textContent = entry.secret || '';
      el.appendChild(s);

      const acts = document.createElement('div');
      acts.className = 'acts';

      const reveal = document.createElement('button');
      reveal.textContent = 'Reveal';
      reveal.onclick = function () {
        reveal.textContent = el.classList.toggle('shown') ? 'Hide' : 'Reveal';
      };

      const copy = document.createElement('button');
      copy.textContent = 'Copy';
      copy.onclick = function () { handlers.copy(entry); };

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = 'Delete';
      del.onclick = function () { handlers.remove(entry); };

      acts.appendChild(reveal);
      acts.appendChild(copy);
      acts.appendChild(del);
      el.appendChild(acts);
      list.appendChild(el);
    });
  }

  function openSheet() {
    ['e-title', 'e-user', 'e-secret', 'e-url'].forEach(function (id) { $(id).value = ''; });
    $('sheet').classList.add('on');
    $('e-title').focus();
  }

  function closeSheet() { $('sheet').classList.remove('on'); }

  function setBuildInfo(hasArgon2) {
    $('verline').textContent = hasArgon2 ? 'VLT1 · argon2id' : 'VLT1 · pbkdf2';
    $('kdfnote').textContent = hasArgon2
      ? 'Key derivation: Argon2id, 64 MiB. Files are written as format VLT1.'
      : 'Key derivation: PBKDF2-SHA256 at 600,000 iterations — a placeholder. '
      + 'Inline an Argon2id WASM build before you trust this with real passwords; '
      + 'the header already carries the parameters, so vaults made now stay readable.';
  }

  return {
    $, toast, showStage, showSealed, showVault,
    renderPhrase, renderEntries, openSheet, closeSheet, setBuildInfo
  };
})();
</script>
<script>
/* app.js — wiring. Owns no crypto and touches no bytes directly;
 * it moves things between the model, the storage layer and the DOM.
 */
(function () {
  const ui = LV.ui, V = LV.vault, S = LV.storage, C = LV.crypto, G = LV.generate;
  const $ = ui.$;

  let candidate = [];           // generated passphrase awaiting confirmation
  const CLIPBOARD_CLEAR_MS = 20000;

  function refresh() {
    ui.renderEntries(V.entries(), {
      copy: async function (entry) {
        try {
          await navigator.clipboard.writeText(entry.secret || '');
          ui.toast('Copied. Clipboard clears in 20s.');
          setTimeout(function () {
            navigator.clipboard.writeText('').catch(function () {});
          }, CLIPBOARD_CLEAR_MS);
        } catch (e) {
          ui.toast('Clipboard blocked by the browser');
        }
      },
      remove: function (entry) {
        V.removeEntry(entry.id);
        refresh();
        ui.toast('Deleted. Save to keep the change.');
      }
    });
  }

  function enterVault() {
    ui.showVault();
    refresh();
    V.resetIdle();
  }

  function lock(message) {
    V.lock();
    ui.showSealed();
    if (message) ui.toast(message);
  }

  /* ---- opening an existing vault ---- */
  $('b-open').onclick = async function () {
    try {
      const bytes = await S.open();
      LV.format.parseHeader(bytes);          // fail fast on the wrong file
      V.setPending(bytes);
      $('fname').textContent = S.fileName();
      ui.showStage('unlock');
      $('pp').focus();
    } catch (e) {
      if (e.name !== 'AbortError') ui.toast(e.message);
    }
  };

  $('b-unlock').onclick = async function () {
    const m = $('m-unlock');
    const entered = $('pp').value.trim();
    if (!entered) { m.textContent = 'Enter your passphrase.'; return; }

    m.textContent = '';
    $('b-unlock').textContent = 'Deriving key…';
    await new Promise(function (r) { setTimeout(r, 20); });   // let the label paint

    try {
      const t0 = performance.now();
      const result = await C.decryptVault(V.getPending(), entered);
      console.log('unlock took', Math.round(performance.now() - t0), 'ms');
      V.adopt(result.data, entered);
      $('pp').value = '';
      enterVault();
    } catch (e) {
      m.textContent = e.message;
    } finally {
      $('b-unlock').textContent = 'Unlock';
    }
  };

  /* ---- creating a new vault ---- */
  $('b-new').onclick = function () {
    candidate = G.passphrase(6);
    ui.renderPhrase(candidate);
    $('confirm').value = '';
    ui.showStage('new');
  };

  $('b-regen').onclick = function () {
    candidate = G.passphrase(6);
    ui.renderPhrase(candidate);
    $('confirm').value = '';
  };

  $('b-copyphrase').onclick = async function () {
    try {
      await navigator.clipboard.writeText(candidate.join(' '));
      ui.toast('Copied');
    } catch (e) {
      ui.toast('Clipboard blocked by the browser');
    }
  };

  $('b-create').onclick = async function () {
    const m = $('m-new');
    if (C.canonical($('confirm').value) !== C.canonical(candidate.join(' '))) {
      m.textContent = 'That does not match. Check the spacing and spelling.';
      return;
    }
    m.textContent = '';
    $('b-create').textContent = 'Encrypting…';
    await new Promise(function (r) { setTimeout(r, 20); });

    try {
      V.create(candidate);
      S.reset('my.vault');
      const bytes = await C.encryptVault(V.get(), V.getPhrase());
      ui.toast(await S.save(bytes));
      enterVault();
    } catch (e) {
      m.textContent = e.message;
    } finally {
      $('b-create').textContent = 'Create vault';
    }
  };

  /* ---- entries ---- */
  $('b-add').onclick = ui.openSheet;
  $('b-cancel').onclick = ui.closeSheet;
  $('b-genpw').onclick = function () { $('e-secret').value = G.password(20); };

  $('b-save-entry').onclick = function () {
    const title = $('e-title').value.trim();
    if (!title) { $('e-title').focus(); ui.toast('Give the entry a name'); return; }
    V.addEntry({
      title: title,
      username: $('e-user').value.trim(),
      secret: $('e-secret').value,
      url: $('e-url').value.trim()
    });
    ui.closeSheet();
    refresh();
    ui.toast('Added. Save to keep the change.');
  };

  /* ---- saving and locking ---- */
  $('b-save').onclick = async function () {
    $('b-save').textContent = 'Encrypting…';
    await new Promise(function (r) { setTimeout(r, 20); });
    try {
      V.bumpRevision();
      const bytes = await C.encryptVault(V.get(), V.getPhrase());
      ui.toast(await S.save(bytes));
    } catch (e) {
      ui.toast(e.message);
    } finally {
      $('b-save').textContent = 'Save vault';
      V.resetIdle();
    }
  };

  $('b-lock').onclick = function () { lock('Locked'); };
  $('b-back').onclick = function () { V.setPending(null); lock(); };
  $('b-back2').onclick = function () { candidate = []; lock(); };

  /* ---- idle handling ---- */
  V.onIdleLock(function () {
    ui.showSealed();
    ui.toast('Locked after 3 minutes idle');
  });
  ['pointerdown', 'keydown', 'visibilitychange'].forEach(function (ev) {
    document.addEventListener(ev, V.resetIdle, { passive: true });
  });

  /* ---- boot ---- */
  ui.setBuildInfo(C.HAS_ARGON2);
  lock();
})();
</script>
</body>
